name: 🐛 버그 리포트 (Bug Report)
description: 서비스 또는 하네스 실행 중 발생한 오류를 제보합니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 재현하고 신속하게 해결할 수 있도록 상세한 정보를 입력해주세요.
  - type: textarea
    id: description
    attributes:
      label: 🔍 문제 설명
      description: 어떤 문제가 발생했는지 구체적으로 설명해주세요.
      placeholder: 예: 관제 포털에서 특정 서비스 상태가 올바르게 갱신되지 않습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 재현 경로
      description: 오류를 재현하기 위한 단계를 적어주세요.
      placeholder: |
        1. '...' 실행
        2. '...' 클릭
        3. 오류 화면 관찰
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📜 관련 로그 및 에러 메시지
      description: 터미널이나 브라우저 콘솔의 에러 로그를 붙여넣어 주세요.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: 💻 실행 환경
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11 / 10
        - Linux (Ubuntu/Debian)
    validations:
      required: true
