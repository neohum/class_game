name: ✨ 신규 기능 제안 (Feature Request)
description: 새로운 기능이나 시스템 개선 아이디어를 제안합니다.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 💡 제안 배경 및 필요성
      description: 어떤 문제나 개선 필요성이 있어 이 기능을 제안하시나요?
      placeholder: 현재 ... 방식 대신 ... 방식을 도입하면 생산성이 향상됩니다.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 🚀 제안하는 해결책 / 기능 명세
      description: 제안하는 기능의 동작 방식이나 설계를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 고려한 대안
      description: 함께 검토했던 다른 방법이나 라이브러리가 있다면 적어주세요.
