<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>달려라 숫자잡기 (1~6학년 EIS 동적 비계)</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text-light: #e2e8f0;
    --muted: #94a3b8;
    --accent: #34d399;
    --gold: #fbbf24;
    --sky: #38bdf8;
    --wrong: #f87171;
    --ground-h: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overflow: hidden;
  }
  img, svg { -webkit-user-drag: none; }
  #games {
    display: flex;
    height: 100vh;
    gap: 8px;
    padding: 8px;
  }
  .game {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    background: var(--panel);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 8px;
    overflow: hidden;
  }
  .game h2 {
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    color: var(--muted);
    white-space: nowrap;
  }
  .game h2 span { color: var(--sky); }
  .grade-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    width: 100%;
    margin-bottom: 6px;
  }
  .grade-btn {
    border: 1.5px solid #334155;
    background: rgba(15, 23, 42, 0.7);
    color: var(--text-light);
    border-radius: 8px;
    padding: 4px 7px;
    min-height: 30px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
  }
  .grade-btn.active {
    background: var(--sky);
    color: #0f172a;
    border-color: var(--sky);
  }
  .hud {
    display: flex;
    gap: 6px;
    align-items: stretch;
    margin-bottom: 6px;
    width: 100%;
    justify-content: center;
  }
  .hud .box {
    background: rgba(15, 23, 42, 0.6);
    border-radius: 8px;
    padding: 4px 8px;
    text-align: center;
    min-width: 0;
    flex: 1 1 0;
    max-width: 110px;
  }
  .hud .label {
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .hud .value {
    font-size: clamp(0.85rem, 1.5vw, 1.2rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .hud .value.progress { color: var(--accent); }
  .eis-badge {
    font-size: 0.68rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(52, 211, 153, 0.16);
    color: var(--accent);
    border: 1px solid rgba(52, 211, 153, 0.4);
    margin-bottom: 4px;
  }
  .question {
    width: 100%;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    padding: 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .qtag {
    font-size: clamp(0.65rem, 1vw, 0.8rem);
    font-weight: 700;
    color: var(--accent);
  }
  .qtext {
    font-size: clamp(1rem, 1.9vw, 1.5rem);
    font-weight: 800;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track {
    position: relative;
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--ground-h);
    border-radius: 7px;
    background: repeating-linear-gradient(90deg,
      #334155 0 24px, #475569 24px 48px);
    background-size: 48px 100%;
    animation: groundmove 0.9s linear infinite paused;
  }
  .track.running .ground { animation-play-state: running; }
  @keyframes groundmove {
    from { background-position-x: 0; }
    to   { background-position-x: -48px; }
  }
  .runner {
    position: absolute;
    left: 10%;
    bottom: var(--ground-h);
    width: 52px;
    height: 70px;
    pointer-events: none;
  }
  .runner .body {
    position: absolute;
    top: 0; left: 3px;
    width: 46px;
    height: 46px;
    border-radius: 46% 46% 42% 42%;
    background: linear-gradient(160deg, hsl(199 89% 70%), hsl(217 91% 55%));
    box-shadow: 0 4px 10px rgba(56, 189, 248, 0.35);
  }
  .runner .eye {
    position: absolute;
    top: 15px;
    width: 9px; height: 11px;
    border-radius: 50%;
    background: #fff;
  }
  .runner .eye::after {
    content: '';
    position: absolute;
    right: 1px; top: 3px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #0f172a;
  }
  .runner .eye.l { left: 12px; }
  .runner .eye.r { left: 26px; }
  .runner .mouth {
    position: absolute;
    left: 17px; top: 30px;
    width: 13px; height: 7px;
    border-radius: 0 0 12px 12px;
    background: #0f172a;
  }
  .runner .leg {
    position: absolute;
    top: 44px;
    width: 9px; height: 22px;
    border-radius: 5px;
    background: hsl(217 91% 45%);
    transform-origin: top center;
  }
  .runner .leg.l { left: 14px; }
  .runner .leg.r { left: 29px; }
  .track.running .leg.l { animation: stride 0.3s ease-in-out infinite; }
  .track.running .leg.r { animation: stride 0.3s ease-in-out infinite reverse; }
  @keyframes stride {
    0%, 100% { transform: rotate(28deg); }
    50%      { transform: rotate(-28deg); }
  }
  .runner.jump { animation: jump 0.45s cubic-bezier(0.3, 0, 0.4, 1); }
  @keyframes jump {
    0%   { transform: translateY(0) scale(1, 1); }
    15%  { transform: translateY(4px) scale(1.1, 0.85); }
    55%  { transform: translateY(-52px) scale(0.95, 1.08); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .bubble {
    position: absolute;
    left: 0;
    bottom: calc(var(--ground-h) + var(--bubble-elev, 82px));
    width: var(--bs, 64px);
    height: var(--bs, 64px);
    border: none;
    border-radius: 50%;
    font-family: inherit;
    font-size: calc(var(--bs, 64px) * 0.36);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #0f172a;
    cursor: pointer;
    touch-action: none;
    box-shadow: inset -4px -6px 12px rgba(15, 23, 42, 0.18),
                0 4px 12px rgba(15, 23, 42, 0.45);
    will-change: transform;
  }
  .bubble.c0 { background: radial-gradient(circle at 32% 28%, hsl(199 95% 84%), hsl(199 89% 58%)); }
  .bubble.c1 { background: radial-gradient(circle at 32% 28%, hsl(45 97% 82%), hsl(43 96% 56%)); }
  .bubble.c2 { background: radial-gradient(circle at 32% 28%, hsl(340 90% 86%), hsl(340 82% 66%)); }
  .bubble.wrong { animation: shake 0.3s; box-shadow: 0 0 0 4px var(--wrong), 0 4px 12px rgba(15, 23, 42, 0.45); }
  @keyframes shake {
    0%, 100% { margin-left: 0; }
    25% { margin-left: -6px; }
    75% { margin-left: 6px; }
  }
  .pop {
    position: absolute;
    width: var(--bs, 64px);
    height: var(--bs, 64px);
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, hsl(152 76% 80%), hsl(152 69% 52%));
    color: #0f172a;
    font-size: calc(var(--bs, 64px) * 0.36);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    animation: popfly 0.55s ease-out forwards;
  }
  @keyframes popfly {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    30%  { transform: translateY(-14px) scale(1.35); opacity: 1; }
    100% { transform: translateY(-52px) scale(0.6); opacity: 0; }
  }
  .speedflash {
    position: absolute;
    left: 50%;
    bottom: calc(var(--ground-h) + 160px);
    transform: translateX(-50%);
    font-size: clamp(0.8rem, 1.4vw, 1.1rem);
    font-weight: 800;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .speedflash.show { animation: flashup 0.8s ease-out; }
  @keyframes flashup {
    0%   { opacity: 0; transform: translate(-50%, 10px); }
    25%  { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -18px); }
  }
  /* 연속 2회 오답 시 화면 하단에 자동 표시되는 수모형/수직선 동적 비계 보조선 */
  .scaffold-guide {
    width: 100%;
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 6px 8px;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }
  .scaffold-guide.hidden { display: none; }
  .scaffold-guide .guide-caption {
    font-size: 0.7rem;
    color: var(--gold);
    font-weight: 700;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 10px 10px 7vh;
    backdrop-filter: blur(3px);
    border-radius: 14px;
    cursor: pointer;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .hidden { display: none; }
  .overlay .title { font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: 800; text-align: center; }
  .overlay .result {
    font-size: clamp(1.6rem, 3.5vw, 2.8rem);
    font-weight: 800;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .overlay .sub { color: var(--muted); font-size: clamp(0.8rem, 1.3vw, 1rem); text-align: center; line-height: 1.5; }
  .overlay .big {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 12px;
    min-height: 56px;
    padding: 12px 32px;
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    touch-action: none;
  }
  .overlay .tap { color: #64748b; font-size: 0.75rem; }
  .players-1 .hud .value { font-size: clamp(0.9rem, 6.4vw, 1.3rem); }
  .players-1 .qtag { font-size: clamp(0.65rem, 4vw, 0.8rem); }
  .players-1 .qtext { font-size: clamp(1.05rem, 8vw, 1.6rem); }
  .players-1 .speedflash { font-size: clamp(0.8rem, 5.6vw, 1.1rem); }
  .players-1 .overlay .title { font-size: clamp(1.2rem, 10vw, 2rem); }
  .players-1 .overlay .result { font-size: clamp(1.6rem, 14vw, 2.8rem); }
  .players-1 .overlay .sub { font-size: clamp(0.8rem, 5.2vw, 1rem); }
  .players-1 .overlay .big { font-size: clamp(1rem, 7.2vw, 1.2rem); }
</style>
</head>
<body>

<div id="games"></div>

<script src="../shared/pedagogy-engine.js"></script>
<script src="./game.js"></script>
<script>
(() => {
  const GameMod = window.NumberCatchRunGame;
  const TOTAL = GameMod.TOTAL;
  const SPEED_UP = GameMod.SPEED_UP;
  const params = new URLSearchParams(location.search);

  const PLAYERS = Math.max(1, Math.min(6, parseInt(params.get('players'), 10) || 4));
  const INITIAL_GRADE = GameMod.clampGrade(parseInt(params.get('grade'), 10) || 1);

  if (!params.has('players')) {
    let chosenGrade = INITIAL_GRADE;
    const sel = document.createElement('div');
    sel.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px 6vh;background:rgba(15,23,42,0.97);color:#e2e8f0;';
    sel.innerHTML =
      '<div style="font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;">학년을 선택하세요 (1~6학년 교육과정 맞춤)</div>' +
      '<div id="init-grade-row" style="display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:720px;">' +
      [1, 2, 3, 4, 5, 6]
        .map(
          g =>
            '<button data-g="' +
            g +
            '" style="flex:1;min-width:90px;min-height:48px;border:2px solid #38bdf8;border-radius:12px;background:' +
            (g === chosenGrade ? '#38bdf8' : '#1e293b') +
            ';color:' +
            (g === chosenGrade ? '#0f172a' : '#e2e8f0') +
            ';font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;touch-action:none;">' +
            g +
            '학년</button>'
        )
        .join('') +
      '</div>' +
      '<div style="font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;margin-top:6px;">몇 명이서 할까요?</div>' +
      '<div style="display:flex;gap:12px;width:100%;max-width:720px;">' +
      [1, 2, 4, 6]
        .map(
          n =>
            '<button data-p="' +
            n +
            '" style="flex:1;border:none;border-radius:14px;background:#34d399;color:#0f172a;font-family:inherit;font-weight:800;font-size:clamp(1rem,2.4vw,1.6rem);padding:clamp(14px,3vh,24px) 4px;cursor:pointer;touch-action:none;">' +
            n +
            '인용</button>'
        )
        .join('') +
      '</div>';
    document.body.appendChild(sel);
    sel.addEventListener('pointerdown', e => {
      const gBtn = e.target.closest('[data-g]');
      if (gBtn) {
        chosenGrade = parseInt(gBtn.dataset.g, 10) || 1;
        sel.querySelectorAll('[data-g]').forEach(el => {
          const active = parseInt(el.dataset.g, 10) === chosenGrade;
          el.style.background = active ? '#38bdf8' : '#1e293b';
          el.style.color = active ? '#0f172a' : '#e2e8f0';
        });
        return;
      }
      const pBtn = e.target.closest('[data-p]');
      if (pBtn) {
        location.search = 'players=' + pBtn.dataset.p + '&grade=' + chosenGrade;
      }
    });
  }
  document.body.classList.add('players-' + PLAYERS);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  function createGame(root, index) {
    root.className = 'game';
    const heading =
      PLAYERS === 1
        ? '달려라 <span>숫자잡기</span>'
        : 'PLAYER ' + (index + 1) + ' · 달려라 <span>숫자잡기</span>';

    const gradeBtnsHtml = [1, 2, 3, 4, 5, 6]
      .map(
        g =>
          `<button type="button" class="grade-btn ${g === INITIAL_GRADE ? 'active' : ''}" data-grade="${g}">${g}학년</button>`
      )
      .join('');

    root.innerHTML = `
      <h2>${heading}</h2>
      <div class="grade-selector" aria-label="학년 선택">${gradeBtnsHtml}</div>
      <div class="eis-badge">표상 단계: 시각 모형 (I)</div>
      <div class="hud">
        <div class="box"><div class="label">진행</div><div class="value progress">0/${TOTAL}</div></div>
        <div class="box"><div class="label">틀림</div><div class="value miss">0</div></div>
        <div class="box"><div class="label">시간</div><div class="value time">0.0</div></div>
      </div>
      <div class="question"><span class="qtag">준비</span><span class="qtext">정답 거품을 잡아요!</span></div>
      <div class="track">
        <button class="bubble c0"></button>
        <button class="bubble c1"></button>
        <button class="bubble c2"></button>
        <div class="runner">
          <div class="leg l"></div><div class="leg r"></div>
          <div class="body"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
        </div>
        <div class="speedflash">더 빨라져요!</div>
        <div class="ground"></div>
      </div>
      <div class="scaffold-guide hidden" aria-live="polite">
        <div class="guide-svg"></div>
        <div class="guide-caption">수모형·수직선 보조선이 켜졌어요!</div>
      </div>
      <div class="overlay">
        <div class="title">달려라 숫자잡기</div>
        <div class="result hidden"></div>
        <div class="sub">1~6학년 맞춤 문제! 흘러가는 거품 중<br>정답 숫자를 잡아요! (${TOTAL}문제)</div>
        <button class="big">시작!</button>
        <div class="tap">화면 아무 곳이나 터치해도 시작</div>
      </div>`;

    const track = root.querySelector('.track');
    const runner = root.querySelector('.runner');
    const ground = root.querySelector('.ground');
    const speedflash = root.querySelector('.speedflash');
    const qtagEl = root.querySelector('.qtag');
    const qtextEl = root.querySelector('.qtext');
    const eisBadgeEl = root.querySelector('.eis-badge');
    const scaffoldGuideEl = root.querySelector('.scaffold-guide');
    const guideSvgEl = root.querySelector('.guide-svg');
    const guideCaptionEl = root.querySelector('.guide-caption');
    const progressEl = root.querySelector('.value.progress');
    const missEl = root.querySelector('.value.miss');
    const timeEl = root.querySelector('.value.time');
    const overlay = root.querySelector('.overlay');
    const overlayTitle = overlay.querySelector('.title');
    const overlayResult = overlay.querySelector('.result');
    const overlaySub = overlay.querySelector('.sub');
    const startBtn = overlay.querySelector('.big');

    const controller = GameMod.createColumnController({ grade: INITIAL_GRADE });

    const S = {
      playing: false,
      grade: INITIAL_GRADE,
      caught: 0,
      miss: 0,
      startTime: 0,
      speed: 0,
      baseSpeed: 0,
      question: null,
      bubbles: [...root.querySelectorAll('.bubble')].map(el => ({
        el,
        x: 0,
        phase: Math.random() * 6.28,
        value: 0,
        wrongTimer: 0,
      })),
      rafId: 0,
      lastTs: 0,
    };

    let trackW = 0;
    let bubbleSize = 64;
    let gap = 120;

    function applyVerticalAnchor() {
      const anchor = GameMod.getVerticalAnchor(S.grade);
      /* 1학년(anchor=1.0)은 하단(82px), 고학년(anchor=0.5)은 트랙 중앙 쪽으로 보간 */
      const elev = Math.round(82 + (1.0 - anchor) * 90);
      root.style.setProperty('--bubble-elev', elev + 'px');
    }

    function layout() {
      trackW = track.clientWidth || root.clientWidth;
      bubbleSize = Math.max(48, Math.min(84, trackW * 0.2));
      root.style.setProperty('--bs', bubbleSize.toFixed(0) + 'px');
      gap = Math.max(bubbleSize * 1.9, (trackW + bubbleSize + 30) / 3);
      applyVerticalAnchor();
    }

    function applyBubble(b, ts) {
      const bob = Math.sin(ts / 480 + b.phase) * 6;
      b.el.style.transform = 'translate3d(' + b.x.toFixed(1) + 'px,' + bob.toFixed(1) + 'px,0)';
    }

    function renderScaffoldState() {
      const st = controller.getState();
      eisBadgeEl.textContent = '표상 단계: ' + st.modeBadge;
      if (st.visualGuideVisible && S.question) {
        scaffoldGuideEl.classList.remove('hidden');
        guideSvgEl.innerHTML = S.question.guideSvg || '';
        guideCaptionEl.textContent = S.question.guideText || st.lastHintMessage;
      } else {
        scaffoldGuideEl.classList.add('hidden');
      }
    }

    function newQuestion() {
      S.question = GameMod.genQuestionForGrade(S.grade, S.caught);
      qtagEl.textContent = S.grade + '학년 · ' + S.question.tag;
      qtextEl.textContent = S.question.text;
      S.bubbles.forEach((b, i) => {
        b.value = S.question.values[i];
        b.el.textContent = b.value;
        b.x = trackW + 16 + i * gap;
        b.el.classList.remove('wrong');
      });
      renderScaffoldState();
    }

    function preview() {
      layout();
      newQuestion();
      S.bubbles.forEach((b, i) => {
        b.x = trackW * (0.08 + 0.31 * i);
        applyBubble(b, i * 700);
      });
    }

    function step(ts) {
      if (!S.playing) return;
      const dt = Math.min(S.lastTs ? ts - S.lastTs : 16, 50);
      S.lastTs = ts;
      for (const b of S.bubbles) {
        b.x -= (S.speed * dt) / 1000;
        if (b.x < -bubbleSize - 12) b.x += gap * 3;
        applyBubble(b, ts);
      }
      timeEl.textContent = ((performance.now() - S.startTime) / 1000).toFixed(1);
      S.rafId = requestAnimationFrame(step);
    }

    function jumpRunner() {
      runner.classList.remove('jump');
      void runner.offsetWidth;
      runner.classList.add('jump');
    }

    function spawnPop(b) {
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.textContent = b.value;
      pop.style.left = b.x.toFixed(1) + 'px';
      pop.style.bottom = b.el.style.bottom || 'calc(var(--ground-h) + var(--bubble-elev, 82px))';
      track.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function onBubble(b) {
      if (!S.playing) return;
      if (String(b.value) !== String(S.question.answer)) {
        S.miss++;
        missEl.textContent = S.miss;
        controller.recordAttempt(false, S.question);
        renderScaffoldState();
        clearTimeout(b.wrongTimer);
        b.el.classList.remove('wrong');
        void b.el.offsetWidth;
        b.el.classList.add('wrong');
        b.wrongTimer = setTimeout(() => b.el.classList.remove('wrong'), 350);
        return;
      }

      S.caught++;
      progressEl.textContent = S.caught + '/' + TOTAL;
      const st = controller.recordAttempt(true, S.question);
      renderScaffoldState();
      jumpRunner();
      spawnPop(b);
      if (S.caught >= TOTAL) return finish();

      S.speed *= SPEED_UP;
      ground.style.animationDuration = ((0.9 * S.baseSpeed) / S.speed).toFixed(2) + 's';
      speedflash.textContent =
        st.consecutiveCorrect >= 3 ? '3연속 정답! 기호 암산 모드!' : '더 빨라져요!';
      speedflash.classList.remove('show');
      void speedflash.offsetWidth;
      speedflash.classList.add('show');
      newQuestion();
    }

    root.querySelector('.grade-selector').addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const btn = e.target.closest('.grade-btn');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const g = GameMod.clampGrade(parseInt(btn.dataset.grade, 10) || 1);
      S.grade = g;
      controller.setGrade(g);
      root.querySelectorAll('.grade-btn').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.grade, 10) === g);
      });
      layout();
      newQuestion();
    });

    track.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const btn = e.target.closest('.bubble');
      if (!btn) return;
      e.preventDefault();
      onBubble(S.bubbles.find(b => b.el === btn));
    });

    function start() {
      layout();
      S.caught = 0;
      S.miss = 0;
      const preset = GameMod.GRADE_PRESETS[S.grade];
      S.baseSpeed = Math.max(44, trackW * 0.15 * (preset ? preset.speedScale : 1));
      S.speed = S.baseSpeed;
      S.lastTs = 0;
      progressEl.textContent = '0/' + TOTAL;
      missEl.textContent = '0';
      timeEl.textContent = '0.0';
      ground.style.animationDuration = '0.9s';
      newQuestion();
      overlay.classList.add('hidden');
      track.classList.add('running');
      S.playing = true;
      S.startTime = performance.now();
      cancelAnimationFrame(S.rafId);
      S.rafId = requestAnimationFrame(step);
    }

    function finish() {
      S.playing = false;
      cancelAnimationFrame(S.rafId);
      const secs = (performance.now() - S.startTime) / 1000;
      timeEl.textContent = secs.toFixed(1);
      overlayTitle.textContent = S.grade + '학년 다 잡았다! 🎉';
      overlayResult.textContent = secs.toFixed(1) + '초';
      overlayResult.classList.remove('hidden');
      overlaySub.innerHTML =
        '틀린 횟수: <b style="color:var(--wrong)">' +
        S.miss +
        '번</b> · 최종 단계: <b>' +
        controller.getState().modeBadge +
        '</b>';
      startBtn.textContent = '다시 시작';
      setTimeout(() => {
        track.classList.remove('running');
        overlay.classList.remove('hidden');
      }, 600);
    }

    overlay.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      start();
    });

    window.addEventListener('resize', () => {
      const oldW = trackW;
      layout();
      if (oldW > 0) S.bubbles.forEach(b => { b.x = (b.x / oldW) * trackW; });
    });

    preview();
  }

  const container = document.getElementById('games');
  for (let i = 0; i < PLAYERS; i++) {
    const panel = document.createElement('div');
    container.appendChild(panel);
    createGame(panel, i);
  }
})();
</script>
</body>
</html>
